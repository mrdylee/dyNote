name: Build Windows distribution
on:
  workflow_dispatch:
    inputs:
      previous_version:
        description: Published Dynote version to install before testing the update
        type: string
        default: ''
  workflow_call:
    inputs:
      previous_version:
        description: Published Dynote version to install before testing the update
        type: string
        default: ''
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Read package version
        id: version
        shell: bash
        run: echo "number=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run package:win
      - run: node scripts/verify-release-package.mjs win32-x64
      - name: Verify Copilot, Word previews and update controls on Windows
        shell: bash
        timeout-minutes: 12
        run: |
          npm install --prefix "$RUNNER_TEMP/dynote-ui-tools" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          export DYNOTE_PLAYWRIGHT_MODULE="$(node --input-type=module -e 'import {pathToFileURL} from "node:url";console.log(pathToFileURL(process.env.RUNNER_TEMP+"/dynote-ui-tools/node_modules/playwright/index.mjs").href)')"
          export DYNOTE_EXECUTABLE="$(node -p "require('node:path').resolve('release/v${{ steps.version.outputs.number }}/Dynote-win32-x64/Dynote.exe')")"
          node scripts/verify-copilot-capture-drafts.mjs
          node scripts/verify-copilot-continuation.mjs
          node scripts/verify-word-documents.mjs
          node scripts/verify-external-file-open.mjs
          node scripts/verify-readable-file-open.mjs
          node scripts/verify-markdown-drag-selection.mjs
          node scripts/verify-markdown-find.mjs
          node scripts/verify-pdf-highlighter.mjs
          node scripts/verify-pdf-links.mjs
          node scripts/verify-vault-space-fixes.mjs
          node scripts/verify-sidebar-file-drop.mjs
          node scripts/verify-theme-workspace.mjs
          node scripts/verify-document-tabs.mjs
          node scripts/verify-vault-entry.mjs
          node scripts/verify-team-repositories.mjs
          DYNOTE_PACKAGED=1 node scripts/verify-personal-sync-ui.mjs
          node --test --test-name-pattern="launching Dynote again" scripts/verify-sticky-review.mjs
          node scripts/verify-update-install.mjs
      - run: node scripts/package-windows-distribution.mjs
      - name: Install native document editors for Windows handoff tests
        shell: pwsh
        run: ./scripts/prepare-windows-office-test.ps1
      - name: Verify installed Windows update, relaunch and Office editing
        shell: bash
        timeout-minutes: 12
        env:
          DYNOTE_PREVIOUS_WINDOWS_VERSION: ${{ inputs.previous_version }}
        run: |
          export DYNOTE_PLAYWRIGHT_MODULE="$(node --input-type=module -e 'import {pathToFileURL} from "node:url";console.log(pathToFileURL(process.env.RUNNER_TEMP+"/dynote-ui-tools/node_modules/playwright/index.mjs").href)')"
          if [[ -n "$DYNOTE_PREVIOUS_WINDOWS_VERSION" ]]; then
            [[ "$DYNOTE_PREVIOUS_WINDOWS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
            previous="$RUNNER_TEMP/dynote-previous"
            mkdir -p "$previous"
            setup="Dynote-$DYNOTE_PREVIOUS_WINDOWS_VERSION-windows-x64-Setup.exe"
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$DYNOTE_PREVIOUS_WINDOWS_VERSION"
            curl --fail --silent --show-error --location --retry 3 "$url/$setup" --output "$previous/$setup"
            curl --fail --silent --show-error --location --retry 3 "$url/SHA256SUMS-windows-x64.txt" --output "$previous/SHA256SUMS-windows-x64.txt"
            (cd "$previous" && awk -v setup="$setup" '$2 == setup {print}' SHA256SUMS-windows-x64.txt | sha256sum --check)
            export DYNOTE_PREVIOUS_WINDOWS_SETUP="$(cygpath -w "$previous/$setup")"
          fi
          node scripts/verify-windows-installer.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dynote-windows-x64
          path: |
            release/v${{ steps.version.outputs.number }}/Dynote-${{ steps.version.outputs.number }}-windows-x64.zip
            release/v${{ steps.version.outputs.number }}/Dynote-${{ steps.version.outputs.number }}-windows-x64-Setup.exe
            release/v${{ steps.version.outputs.number }}/latest.json
            release/v${{ steps.version.outputs.number }}/SHA256SUMS-windows-x64.txt
          if-no-files-found: error
          compression-level: 0

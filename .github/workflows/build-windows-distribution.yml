name: Build Windows distribution
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Read package version
        id: version
        shell: bash
        run: echo "number=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run package:win
      - run: node scripts/verify-release-package.mjs win32-x64
      - run: node scripts/package-windows-distribution.mjs
      - name: Verify installer and in-app update on Windows
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/dynote-ui-tools" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          export DYNOTE_PLAYWRIGHT_MODULE="$(node --input-type=module -e 'import {pathToFileURL} from "node:url";console.log(pathToFileURL(process.env.RUNNER_TEMP+"/dynote-ui-tools/node_modules/playwright/index.mjs").href)')"
          node scripts/verify-windows-installer.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dynote-windows-x64
          path: |
            release/v${{ steps.version.outputs.number }}/Dynote-${{ steps.version.outputs.number }}-windows-x64.zip
            release/v${{ steps.version.outputs.number }}/Dynote-${{ steps.version.outputs.number }}-windows-x64-Setup.exe
            release/v${{ steps.version.outputs.number }}/SHA256SUMS-windows-x64.txt
          if-no-files-found: error
          compression-level: 0

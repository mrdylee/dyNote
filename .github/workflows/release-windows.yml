name: Publish Windows v0.12.0
on:
  push:
    branches: [release/windows-v0.12.0]
permissions:
  contents: write
concurrency:
  group: release-windows-v0.12.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Verify immutable release source
        run: |
          if ((git rev-parse HEAD) -ne (git rev-parse v0.12.0)) { throw 'HEAD must match v0.12.0' }
          if ((Get-Content package.json | ConvertFrom-Json).version -ne '0.12.0') { throw 'Version mismatch' }
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests on Windows
        run: npm test
      - name: Install official CLI runtimes on isolated runner
        run: npm install --global @openai/codex@0.166.0 @anthropic-ai/claude-code@2.1.314
      - name: Verify native CLI discovery and local streaming without real credentials
        run: node scripts/verify-ai-cli-runtime.mjs
      - name: Build Windows x64 package
        run: npm run package:win
      - name: Check package and start actual Windows executable
        run: |
          $package = Join-Path $PWD 'release/v0.12.0/Dynote-win32-x64'
          $exe = Join-Path $package 'Dynote.exe'
          $runtime = Join-Path $package 'resources/app.asar.unpacked/node_modules/@github/copilot-sdk-win32-x64/prebuilds/win32-x64/copilot-runtime.exe'
          if (!(Test-Path $exe) -or !(Test-Path $runtime)) { throw 'Missing Windows executable or Copilot runtime' }
          $env:OPEN_NOTES_DATA = Join-Path $env:RUNNER_TEMP 'dynote-release-smoke'
          New-Item -ItemType Directory -Force $env:OPEN_NOTES_DATA | Out-Null
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) { throw "Dynote exited early: $($process.ExitCode)" }
            if (!$process.MainWindowHandle) { throw 'Dynote did not create a native window' }
            Write-Host "Native Windows window: $($process.MainWindowTitle)"
            if (!$process.CloseMainWindow() -or !$process.WaitForExit(10000)) { throw 'Dynote did not close normally' }
            if ($process.ExitCode -ne 0) { throw "Dynote exit code: $($process.ExitCode)" }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Archive Windows folder and checksum
        run: |
          $zip = Join-Path $PWD 'release/v0.12.0/Dynote-0.12.0-windows-x64.zip'
          Compress-Archive -Path 'release/v0.12.0/Dynote-win32-x64' -DestinationPath $zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            if (!$archive.GetEntry('Dynote-win32-x64/Dynote.exe')) { throw 'Archive root is invalid' }
            foreach ($entry in $archive.Entries) {
              $stream = $entry.Open()
              try { $stream.CopyTo([System.IO.Stream]::Null) } finally { $stream.Dispose() }
            }
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Dynote-0.12.0-windows-x64.zip" | Set-Content 'release/v0.12.0/SHA256SUMS-windows-x64.txt' -Encoding ascii
          Write-Host "Windows archive SHA256: $hash"
      - name: Publish verified Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = 'mrdylee/dyNote'
          $tag = 'v0.12.0'
          $releaseJson = gh release view $tag --repo $repo --json isDraft,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --verify-tag --draft --prerelease --title 'Dynote v0.12.0 — 문서 비교·저널·Codex·Claude' --notes-file docs/RELEASE-NOTES-0.12.0.md
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create release draft' }
          } else {
            $release = $releaseJson | ConvertFrom-Json
            if (!$release.isDraft -or @($release.assets).Count) { throw 'Existing release needs inspection; refusing to replace assets' }
          }
          gh release upload $tag 'release/v0.12.0/Dynote-0.12.0-windows-x64.zip' 'release/v0.12.0/SHA256SUMS-windows-x64.txt' --repo $repo
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed' }
          gh release edit $tag --repo $repo --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          gh release view $tag --repo $repo --json url,isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw 'Published release readback failed' }

name: Verify Windows font picker v0.17.0
on:
  push:
    branches: [release/verify-windows-font-v0.17.0]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/dynote-ui-tools" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:DYNOTE_EXECUTABLE = Join-Path $PWD 'release/v0.17.0/Dynote-win32-x64/Dynote.exe'
          $env:DYNOTE_PLAYWRIGHT_MODULE = node -p "require('node:url').pathToFileURL(require('node:path').join(process.env.RUNNER_TEMP,'dynote-ui-tools/node_modules/playwright/index.mjs')).href"
          node scripts/verify-settings-runtime.mjs

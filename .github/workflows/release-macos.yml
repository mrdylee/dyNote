name: Build macOS distribution
on:
  workflow_call:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Verify build platform and version
        run: |
          test "$(uname -m)" = arm64
          node -e "if(require('./package.json').version !== '0.23.21') process.exit(1)"
      - run: npm ci
      - name: Unit tests on macOS
        run: npm test
      - name: Build signed bundle and distribution files
        run: |
          npm run package:mac
          node scripts/package-mac-distribution.mjs
      - name: Verify archives and packaged app UI
        run: |
          package="$PWD/release/v0.23.21"
          hdiutil verify "$package/Dynote-0.23.21-macos-arm64.dmg"
          ditto -x -k "$package/Dynote-0.23.21-macos-arm64.zip" "$RUNNER_TEMP/dynote-extracted"
          codesign --verify --deep --strict "$RUNNER_TEMP/dynote-extracted/Dynote.app"
          test -x "$RUNNER_TEMP/dynote-extracted/Dynote.app/Contents/MacOS/Dynote"
          npm install --prefix "$RUNNER_TEMP/dynote-ui-tools" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          export DYNOTE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/dynote-ui-tools/node_modules/playwright/index.mjs"
          export DYNOTE_EXECUTABLE="$RUNNER_TEMP/dynote-extracted/Dynote.app/Contents/MacOS/Dynote"
          node scripts/verify-cloud-bridge.mjs
          node scripts/verify-ai-providers.mjs
          node scripts/verify-journal-workspace.mjs
          DYNOTE_PACKAGED=1 node scripts/verify-personal-sync-ui.mjs
          node scripts/verify-vault-entry.mjs
          node scripts/verify-team-repositories.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dynote-macos-arm64
          path: |
            release/v0.23.21/Dynote-0.23.21-macos-arm64.dmg
            release/v0.23.21/Dynote-0.23.21-macos-arm64.zip
            release/v0.23.21/SHA256SUMS-macos-arm64.txt
          if-no-files-found: error
          compression-level: 0

name: Publish Dynote beta v0.23.20
on:
  push:
    branches: [validation/cloud-git-v0.23.20, release/dynote-v0.23.20]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.ref == 'refs/heads/validation/cloud-git-v0.23.20'
    uses: ./.github/workflows/build-windows-distribution.yml
    with:
      previous_version: '0.23.19'
  macos:
    if: github.ref == 'refs/heads/validation/cloud-git-v0.23.20'
    uses: ./.github/workflows/release-macos.yml
  publish:
    if: github.ref == 'refs/heads/release/dynote-v0.23.20'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the successful build for this exact commit
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/release-windows-installer.yml/runs" \
            -f branch=validation/cloud-git-v0.23.20 -f event=push -f status=success -f head_sha="$GITHUB_SHA" \
            --jq '.workflow_runs[0].id // empty')
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.verified.outputs.run_id }}
          pattern: dynote-*
          merge-multiple: true
          path: release/v0.23.20
      - name: Check artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(node -p "require('./package.json').version")" = 0.23.20
          test "$(git rev-parse origin/release/dynote-v0.23.20)" = "$GITHUB_SHA"
          if gh release view v0.23.20 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; inspect it before retrying.' >&2
            exit 1
          fi
          cd release/v0.23.20
          sha256sum --check SHA256SUMS-windows-x64.txt SHA256SUMS-macos-arm64.txt
          gh release create v0.23.20 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title 'Dynote v0.23.20 — Copilot 중계 Git 설정' \
            --notes-file ../../docs/RELEASE-NOTES-0.23.20.md \
            Dynote-0.23.20-windows-x64-Setup.exe Dynote-0.23.20-windows-x64.zip SHA256SUMS-windows-x64.txt latest.json \
            Dynote-0.23.20-macos-arm64.dmg Dynote-0.23.20-macos-arm64.zip SHA256SUMS-macos-arm64.txt
          gh release edit v0.23.20 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease

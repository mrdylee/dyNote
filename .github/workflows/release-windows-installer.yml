name: Publish Dynote Windows beta v0.23.15
on:
  push:
    branches: [release/dynote-v0.23.15]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    uses: ./.github/workflows/build-windows-distribution.yml
    with:
      previous_version: '0.23.14'
  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dynote-windows-x64
          path: release/v0.23.15
      - name: Check artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(node -p "require('./package.json').version")" = 0.23.15
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(git rev-parse origin/release/dynote-v0.23.15)" = "$GITHUB_SHA"
          if gh release view v0.23.15 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; inspect it before retrying.' >&2
            exit 1
          fi
          cd release/v0.23.15
          sha256sum --check SHA256SUMS-windows-x64.txt
          gh release create v0.23.15 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title 'Dynote v0.23.15 — Copilot 저장 기록 복구와 개인 노트 Git 설정 (Windows)' \
            --notes-file ../../docs/RELEASE-NOTES-0.23.15.md \
            Dynote-0.23.15-windows-x64-Setup.exe Dynote-0.23.15-windows-x64.zip SHA256SUMS-windows-x64.txt
          gh release edit v0.23.15 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease

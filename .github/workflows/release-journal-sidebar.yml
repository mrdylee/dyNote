name: Publish Dynote beta v0.23.2
on:
  push:
    branches: [release/dynote-v0.23.2]
permissions:
  contents: read
concurrency:
  group: release-dynote-v0.23.2
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            package: darwin-arm64
          - os: windows-latest
            platform: win
            package: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Verify release source
        shell: bash
        run: |
          node -e "if(require('./package.json').version !== '0.23.2') process.exit(1)"
      - run: npm ci
      - run: npm test
      - name: Audit runtime and build dependencies
        shell: bash
        run: |
          npm audit --omit=dev --audit-level=moderate
          if npm audit --audit-level=moderate --json > "$RUNNER_TEMP/dynote-audit.json"; then exit 0; fi
          node --input-type=module - "$RUNNER_TEMP/dynote-audit.json" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const { packages } = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(report.auditReportVersion, 2);
          const blocked = Object.values(report.vulnerabilities).filter(v => ['moderate', 'high', 'critical'].includes(v.severity));
          const advisories = blocked.flatMap(v => v.via.filter(cause => typeof cause === 'object'));
          // No upstream fix yet, and the package check below excludes this build-only dependency from the app.
          assert.ok(advisories.length && advisories.every(a => a.name === 'picomatch' && a.url === 'https://github.com/advisories/GHSA-fc5q-39xc-vjpf'), 'Unexpected npm audit findings');
          assert.ok(blocked.every(v => v.nodes.length && v.nodes.every(node => packages[node]?.dev === true)), 'An affected dependency is not build-only');
          console.warn('Build-only npm audit exception for GHSA-fc5q-39xc-vjpf');
          NODE
      - run: npm run package:${{ matrix.platform }}
      - name: Verify packaged source and security dependency
        env:
          DYNOTE_PACKAGE_REPORT: release/v0.23.2/package-verification-${{ matrix.platform }}.json
        run: node scripts/verify-release-package.mjs ${{ matrix.package }}
      - name: Native readable file opening, color palette, workspace, journal, Git and AI verification
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/dynote-ui-tools" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          node scripts/verify-journal-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-${{ matrix.platform }}
          path: |
            output/playwright/**/*.json
            release/v0.23.2/package-verification-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Create Mac distribution
        if: matrix.platform == 'mac'
        run: |
          test "$(uname -m)" = arm64
          node scripts/package-mac-distribution.mjs
          hdiutil verify release/v0.23.2/Dynote-0.23.2-macos-arm64.dmg
      - name: Create Windows distribution
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $zip = Join-Path $PWD 'release/v0.23.2/Dynote-0.23.2-windows-x64.zip'
          Compress-Archive -Path 'release/v0.23.2/Dynote-win32-x64' -DestinationPath $zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            if (!$archive.GetEntry('Dynote-win32-x64/Dynote.exe')) { throw 'Archive root is invalid' }
            foreach ($entry in $archive.Entries) {
              $stream = $entry.Open()
              try { $stream.CopyTo([System.IO.Stream]::Null) } finally { $stream.Dispose() }
            }
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Dynote-0.23.2-windows-x64.zip" | Set-Content 'release/v0.23.2/SHA256SUMS-windows-x64.txt' -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-${{ matrix.platform }}
          path: |
            release/v0.23.2/*.dmg
            release/v0.23.2/*.zip
            release/v0.23.2/SHA256SUMS-*.txt
            release/v0.23.2/package-verification-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: runtime-*
          merge-multiple: true
          path: release/v0.23.2
      - name: Verify and publish both platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release/v0.23.2
          sha256sum --check SHA256SUMS-macos-arm64.txt
          sha256sum --check SHA256SUMS-windows-x64.txt
          cd ../..
          if gh release view v0.23.2 --repo mrdylee/dyNote >/dev/null 2>&1; then
            echo 'Release already exists; inspect it before retrying.' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.23.2 >/dev/null 2>&1; then
            git fetch origin tag v0.23.2
            test "$(git rev-parse 'v0.23.2^{commit}')" = "$GITHUB_SHA"
          fi
          gh release create v0.23.2 --repo mrdylee/dyNote --target "$GITHUB_SHA" --draft --prerelease --title 'Dynote v0.23.2 — 파일 이름 변경과 Copilot 프로젝트 표시' --notes-file docs/RELEASE-NOTES-0.23.2.md
          gh release upload v0.23.2 --repo mrdylee/dyNote release/v0.23.2/Dynote-0.23.2-macos-arm64.dmg release/v0.23.2/Dynote-0.23.2-macos-arm64.zip release/v0.23.2/Dynote-0.23.2-windows-x64.zip release/v0.23.2/SHA256SUMS-macos-arm64.txt release/v0.23.2/SHA256SUMS-windows-x64.txt release/v0.23.2/package-verification-mac.json release/v0.23.2/package-verification-win.json
          gh release edit v0.23.2 --repo mrdylee/dyNote --draft=false --prerelease
          gh release view v0.23.2 --repo mrdylee/dyNote --json url,isDraft,isPrerelease,assets

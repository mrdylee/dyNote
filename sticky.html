<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'" />
  <title>Dynote 포스트잇</title>
</head>
<body data-color="cream">
  <header>
    <span>포스트잇</span>
    <button id="pin" type="button" aria-label="항상 위에 고정" title="항상 위에 고정" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3l6 6-2 2-3-1-4 4v3l-2 2-5-5 2-2h3l4-4-1-3zM8 16l-5 5"/></svg>
    </button>
    <button id="close" type="button" aria-label="포스트잇 닫기" title="포스트잇 닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </header>
  <textarea id="memo" aria-label="포스트잇 메모" placeholder="메모를 입력하세요…" spellcheck="false" disabled></textarea>
  <footer id="status" role="status"></footer>
  <script type="module" src="/src/sticky.mjs"></script>
</body>
</html>
